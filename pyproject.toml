[project]
name = "bootstrap"
version = "2026.0.0"
description = "FRC Programming Bootcamp - a six-session bootstrap for new FRC programmers."
readme = "README.md"
authors = [{ name = "Chris Lunsford", email = "cm@lunsford.io" }]
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material[recommended]>=9.7.7",
    "mkdocs-open-in-new-tab>=1.0.8",
]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "B", # flake8-bugbear
    "I", # isort
    "Q", # flake8-quotes
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

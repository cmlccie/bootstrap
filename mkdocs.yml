site_name: FRC Programming Bootcamp
site_description: A six-session bootcamp that bootstraps new FRC programmers - from first commit to code running on a robot.
site_author: Chris Lunsford
site_url: https://cmlccie.github.io/bootstrap/

# Repository information
repo_name: cmlccie/bootstrap
repo_url: https://github.com/cmlccie/bootstrap
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search
  - open-in-new-tab

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Navigation
nav:
  - Home: index.md
  - Session 1:
      - session-1/index.md
      - The FRC Stack: session-1/frc-stack.md
      - GitHub Setup: session-1/github-setup.md
      - Your First Codespace: session-1/first-codespace.md
      - Your First Commit: session-1/first-commit.md
      - Reference: session-1/reference.md
  - Session 2:
      - session-2/index.md
      - The Routine: session-2/routine.md
      - Anatomy of Robot Code: session-2/anatomy.md
      - Reading Java: session-2/java-basics.md
      - Logging: session-2/logging.md
      - "Exercise: The Heartbeat": session-2/exercise-heartbeat.md
      - Java Cheat Sheet: session-2/java-cheat-sheet.md
      - Reference: session-2/reference.md
  - Session 3:
      - session-3/index.md
      - Command-Based Robots: session-3/command-based.md
      - Classes and Objects: session-3/classes-and-objects.md
      - Conditionals: session-3/conditionals.md
      - "Exercise: The RSL": session-3/exercise-rsl.md
      - Reference: session-3/reference.md
  - Session 4:
      - session-4/index.md
      - Controllers to Motors: session-4/controllers.md
      - Methods and Lambdas: session-4/methods-and-lambdas.md
      - "Exercise: Drive Input": session-4/exercise-drive-input.md
      - "Exercise: Arcade Drive": session-4/exercise-arcade-drive.md
      - Simulate It: session-4/simulate.md
      - Reference: session-4/reference.md
  - Session 5:
      - session-5/index.md
      - Sensors and Feedback: session-5/sensors.md
      - Units and Tests: session-5/units-and-tests.md
      - "Exercise: Encoder Test": session-5/exercise-encoder-test.md
      - "Exercise: Odometry": session-5/exercise-odometry.md
      - Logs and AdvantageScope: session-5/logs.md
      - Run It on the Romi: session-5/romi.md
      - Reference: session-5/reference.md
  - Session 6 (optional):
      - session-6/index.md
      - Autonomous Commands: session-6/autonomous-commands.md
      - Sequences and the Chooser: session-6/sequences-and-chooser.md
      - Run It: session-6/run-it.md
      - Reference: session-6/reference.md

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gryphoncommand/2026-bootcamp
      name: Bootcamp code repository

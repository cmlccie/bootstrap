site_name: FRC Programming Bootcamp
site_description: A six-session bootcamp that bootstraps new FRC programmers - from first commit to code running on a robot.
site_author: Chris Lunsford
site_url: https://cmlccie.github.io/bootstrap/

# Repository information
repo_name: cmlccie/bootstrap
repo_url: https://github.com/cmlccie/bootstrap
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search
  - open-in-new-tab

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Navigation
nav:
  - Home: index.md
  - Session 1:
      - session-1/index.md
      - The FRC Stack: session-1/frc-stack.md
      - GitHub Setup: session-1/github-setup.md
      - Your First Codespace: session-1/first-codespace.md
      - Your First Commit: session-1/first-commit.md
      - Reference: session-1/reference.md
  - Session 2:
      - session-2/index.md
  - Session 3:
      - session-3/index.md
  - Session 4:
      - session-4/index.md
  - Session 5:
      - session-5/index.md
  - Session 6:
      - session-6/index.md

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gryphoncommand/2026-bootcamp
      name: Bootcamp code repository
